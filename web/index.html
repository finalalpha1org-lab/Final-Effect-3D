<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Effect 3D — Stage 2 WebAssembly Viewport</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11141a;
      --panel: rgba(20, 24, 32, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --text: #e6ebf2;
      --muted: #9aa4b4;
      --accent: #e0762e;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    #fe3d-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
    }
    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
      max-width: 360px;
    }
    .hud strong {
      color: var(--accent);
    }
    .hud .muted {
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="fe3d-canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div class="hud">
    <div><strong>Final Effect 3D</strong> &middot; Stage 2 WebAssembly Prototype</div>
    <div class="muted">
      LMB: Pick Object &middot; RMB / Alt+LMB: Orbit &middot; Shift+MMB: Pan<br />
      Wheel: Dolly Zoom &middot; F: Frame &middot; Del: Delete &middot; Ctrl+Z/Y: Undo/Redo &middot; Space: Pause
    </div>
  </div>
  <script src="finaleffect_web.js"></script>
</body>
</html>
