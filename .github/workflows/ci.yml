# SPDX-License-Identifier: GPL-3.0-or-later
# Final Effect 3D - Honest Cross-Platform Continuous Integration

name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core-matrix:
    name: Core & Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (Debug)
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Debug
          - name: Linux GCC (Release)
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            build_type: Release
          - name: Linux Clang (Release)
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            build_type: Release
          - name: macOS AppleClang (Release)
            os: macos-15-intel
            cc: clang
            cxx: clang++
            build_type: Release
          - name: Windows MSVC (Debug)
            os: windows-2022
            build_type: Debug
          - name: Windows MSVC (Release)
            os: windows-2022
            build_type: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Core + WebGL2 Adapter Tests)
        shell: bash
        run: |
          CC_ARGS=()
          if [ -n "${{ matrix.cc }}" ]; then
            CC_ARGS+=("-DCMAKE_C_COMPILER=${{ matrix.cc }}" "-DCMAKE_CXX_COMPILER=${{ matrix.cxx }}")
          fi
          cmake -S . -B build/ci-core \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DFINALEFFECT_BUILD_RENDERER_DESKTOP=OFF \
            -DFINALEFFECT_BUILD_RENDERER_WEBGL2=ON \
            -DFINALEFFECT_BUILD_TESTS=ON \
            -DFINALEFFECT_WARNINGS_AS_ERRORS=ON \
            "${CC_ARGS[@]}"

      - name: Compile Core & Tests
        run: cmake --build build/ci-core --config ${{ matrix.build_type }} --parallel

      - name: Execute Unit & Integration Tests
        run: ctest --test-dir build/ci-core --build-config ${{ matrix.build_type }} --output-on-failure --verbose

  linux-desktop-opengl:
    name: Linux Desktop OpenGL 3.3 + GLFW
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GLFW, Mesa OpenGL, and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            xvfb

      - name: Configure Desktop OpenGL 3.3 Build
        run: |
          cmake -S . -B build/ci-desktop \
            -DCMAKE_BUILD_TYPE=Release \
            -DFINALEFFECT_BUILD_RENDERER_DESKTOP=ON \
            -DFINALEFFECT_BUILD_RENDERER_WEBGL2=ON \
            -DFINALEFFECT_REQUIRE_GLFW=ON \
            -DFINALEFFECT_BUILD_TESTS=ON \
            -DFINALEFFECT_WARNINGS_AS_ERRORS=ON

      - name: Compile Desktop Application & Tests
        run: cmake --build build/ci-desktop --config Release --parallel

      - name: Execute All CTest Suites
        run: ctest --test-dir build/ci-desktop --build-config Release --output-on-failure --verbose

      - name: Smoke-Test Windowed OpenGL 3.3 Renderer & Binary Bundle Export under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/ci-desktop/finaleffect_desktop --frames 5
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/ci-desktop/finaleffect_desktop --start-in-studio --frames 5 \
            --export-project build/ci-desktop/ci_roundtrip.fe3d \
            --export-bundle build/ci-desktop/ci_bundle.fe3d
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ./build/ci-desktop/finaleffect_desktop --system-info
          ./build/ci-desktop/finaleffect_desktop --headless --frames 2 --project build/ci-desktop/ci_roundtrip.fe3d
          ./build/ci-desktop/finaleffect_desktop --headless --frames 2 --project build/ci-desktop/ci_bundle.fe3d

      - name: Capture & Verify Stage 1.1 Native Desktop Home Hub OpenGL 3.3 Screenshots (1920x1080, 2560x1440, 1366x768 @ 100%/125%)
        run: |
          mkdir -p build/ci-native-screenshots
          xvfb-run -a -s "-screen 0 2880x1800x24" \
            ./build/ci-desktop/finaleffect_desktop --width 1920 --height 1080 \
            --config-dir build/ci-desktop/cfg_1080 \
            --capture-hub-screenshots build/ci-native-screenshots/1920x1080_100pct
          xvfb-run -a -s "-screen 0 2880x1800x24" \
            ./build/ci-desktop/finaleffect_desktop --width 2560 --height 1440 \
            --config-dir build/ci-desktop/cfg_1440 \
            --capture-hub-screenshots build/ci-native-screenshots/2560x1440_100pct
          xvfb-run -a -s "-screen 0 2880x1800x24" \
            ./build/ci-desktop/finaleffect_desktop --width 1366 --height 768 \
            --config-dir build/ci-desktop/cfg_768_100 \
            --capture-hub-screenshots build/ci-native-screenshots/1366x768_100pct
          xvfb-run -a -s "-screen 0 2880x1800x24" \
            ./build/ci-desktop/finaleffect_desktop --width 1366 --height 768 \
            --set-pref-scale 125 \
            --config-dir build/ci-desktop/cfg_768_125 \
            --capture-hub-screenshots build/ci-native-screenshots/1366x768_125pct

          for stem in \
            01_projects_start \
            02_templates \
            03_new_project \
            04_open_project \
            05_recovery_autosave \
            06_preferences \
            07_about_system_info \
            08_home_to_studio_transition \
            09_studio_to_home_populated; do
            test -s "build/ci-native-screenshots/1920x1080_100pct/${stem}_1920x1080_100pct.png"
            test -s "build/ci-native-screenshots/2560x1440_100pct/${stem}_2560x1440_100pct.png"
            test -s "build/ci-native-screenshots/1366x768_100pct/${stem}_1366x768_100pct.png"
            test -s "build/ci-native-screenshots/1366x768_125pct/${stem}_1366x768_125pct.png"
          done

      - name: Upload Stage 1.1 Native Desktop Home Hub OpenGL 3.3 Screenshots (All Resolutions & Scales)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-desktop-hub-screenshots
          path: build/ci-native-screenshots/
          if-no-files-found: error

      - name: Upload Native Screenshot 1 - Projects & Start (1920x1080 OpenGL 3.3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-01-projects-start.png
          path: build/ci-native-screenshots/1920x1080_100pct/01_projects_start_1920x1080_100pct.png
          if-no-files-found: error

      - name: Upload Native Screenshot 2 - Templates (1920x1080 OpenGL 3.3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-02-templates.png
          path: build/ci-native-screenshots/1920x1080_100pct/02_templates_1920x1080_100pct.png
          if-no-files-found: error

      - name: Upload Native Screenshot 3 - New Project (1920x1080 OpenGL 3.3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-03-new-project.png
          path: build/ci-native-screenshots/1920x1080_100pct/03_new_project_1920x1080_100pct.png
          if-no-files-found: error

      - name: Upload Native Screenshot 4 - Open Project (1920x1080 OpenGL 3.3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-04-open-project.png
          path: build/ci-native-screenshots/1920x1080_100pct/04_open_project_1920x1080_100pct.png
          if-no-files-found: error

      - name: Upload Native Screenshot 5 - Recovery & Autosave (1920x1080 OpenGL 3.3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-05-recovery-autosave.png
          path: build/ci-native-screenshots/1920x1080_100pct/05_recovery_autosave_1920x1080_100pct.png
          if-no-files-found: error

      - name: Upload Native Screenshot 6 - Preferences (1920x1080 OpenGL 3.3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-06-preferences.png
          path: build/ci-native-screenshots/1920x1080_100pct/06_preferences_1920x1080_100pct.png
          if-no-files-found: error

      - name: Upload Native Screenshot 7 - About & System Info (1920x1080 OpenGL 3.3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-07-about-system-info.png
          path: build/ci-native-screenshots/1920x1080_100pct/07_about_system_info_1920x1080_100pct.png
          if-no-files-found: error

      - name: Upload Native Screenshot 8 - Home to 3D Studio Transition (1920x1080 OpenGL 3.3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-08-home-to-studio-transition.png
          path: build/ci-native-screenshots/1920x1080_100pct/08_home_to_studio_transition_1920x1080_100pct.png
          if-no-files-found: error

      - name: Upload Native Screenshot 9 - Studio to Home Populated (1920x1080 OpenGL 3.3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-1-native-09-studio-to-home-populated.png
          path: build/ci-native-screenshots/1920x1080_100pct/09_studio_to_home_populated_1920x1080_100pct.png
          if-no-files-found: error

  web-wasm-emscripten:
    name: WebAssembly + WebGL2 Studio & Chromium E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.68

      - name: Configure WebAssembly Build
        run: |
          emcmake cmake -S . -B build/ci-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DFINALEFFECT_BUILD_RENDERER_DESKTOP=OFF \
            -DFINALEFFECT_BUILD_RENDERER_WEBGL2=ON \
            -DFINALEFFECT_BUILD_TESTS=OFF \
            -DFINALEFFECT_WARNINGS_AS_ERRORS=ON

      - name: Compile WebAssembly Bundle
        run: |
          cmake --build build/ci-wasm --parallel
          test -f build/ci-wasm/finaleffect_web.js
          test -f build/ci-wasm/finaleffect_web.wasm
          test -f build/ci-wasm/index.html
          test -f build/ci-wasm/editor.css
          test -f build/ci-wasm/studios.js
          test -f build/ci-wasm/editor.js
          test -f build/ci-wasm/maya_workspace.js
          test -f build/ci-wasm/src/main_stage1.js

      - name: Run Stage 1 Modular Web Service Unit Tests
        run: node --test web/tests/stage1_services.test.mjs

      - name: Install Playwright & Headless Chromium
        working-directory: web/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture Stage 5 Baseline Screenshots (Before Stage 5.1 Polish)
        run: |
          if git cat-file -e d0c257c^{commit} 2>/dev/null; then
            mkdir -p build/ci-wasm-before
            cp build/ci-wasm/finaleffect_web.js build/ci-wasm/finaleffect_web.wasm build/ci-wasm-before/
            git show d0c257c:web/index.html > build/ci-wasm-before/index.html
            git show d0c257c:web/editor.css > build/ci-wasm-before/editor.css
            git show d0c257c:web/studios.js > build/ci-wasm-before/studios.js
            git show d0c257c:web/editor.js > build/ci-wasm-before/editor.js
            (cd web/e2e && node capture-baseline.mjs)
          fi

      - name: Verify Connected Studio UI in Real Chromium (WebAssembly + WebGL 2.0)
        working-directory: web/e2e
        env:
          CI: "true"
          FE3D_WEB_DIST_DIR: ../../build/ci-wasm
        run: npx playwright test --reporter=list,github

      - name: Upload Stage 1 Home Hub & 3D Studio Chromium Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-effect-3d-ui-screenshots
          path: build/ci-screenshots/
          if-no-files-found: ignore

      - name: Upload Screenshot 1 - Projects & Start (1920x1080)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-01-projects-start.png
          path: build/ci-screenshots/stage1-01-projects-start.png
          if-no-files-found: ignore

      - name: Upload Screenshot 2 - Templates (1920x1080)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-02-templates.png
          path: build/ci-screenshots/stage1-02-templates.png
          if-no-files-found: ignore

      - name: Upload Screenshot 3 - New Project (1920x1080)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-03-new-project.png
          path: build/ci-screenshots/stage1-03-new-project.png
          if-no-files-found: ignore

      - name: Upload Screenshot 4 - Open Project (1920x1080)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-04-open-project.png
          path: build/ci-screenshots/stage1-04-open-project.png
          if-no-files-found: ignore

      - name: Upload Screenshot 5 - Recovery & Autosave (1920x1080)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-05-recovery-autosave.png
          path: build/ci-screenshots/stage1-05-recovery-autosave.png
          if-no-files-found: ignore

      - name: Upload Screenshot 6 - Preferences (1920x1080)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-06-preferences.png
          path: build/ci-screenshots/stage1-06-preferences.png
          if-no-files-found: ignore

      - name: Upload Screenshot 7 - About & System Information (1920x1080)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-07-about-system-info.png
          path: build/ci-screenshots/stage1-07-about-system-info.png
          if-no-files-found: ignore
